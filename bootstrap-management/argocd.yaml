apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
        argocd.argoproj.io/reconcile-timeout: "15" 
spec:
  project: default
  source:
    repoURL: "https://argoproj.github.io/argo-helm"
    chart: argo-cd
    targetRevision: 9.4.17
    helm:
      releaseName: argocd
      valuesObject:
        redis-ha:
          metrics:
            enabled: true
          enabled: true
        dex:
          metrics:
            enabled: true
        controller:
          metrics:
            enabled: true
          replicas: 3
        repoServer:
          metrics:
            enabled: true
          autoscaling:
            enabled: true
            minReplicas: 2
        applicationSet:
          metrics:
            enabled: true
          replicas: 3
        global:
          domain: argocd.lightjack.lan
        configs:
          params:
            server.insecure: true
          cm:
            controller.diff.server.side: "true"
            # ----- Restore: gates the -300 sync wave -----
            resource.customizations.health.velero.io_Restore: |
              hs = {}
              if obj.status == nil or obj.status.phase == nil then
                hs.status = "Progressing"
                hs.message = "Waiting for restore to start"
                return hs
              end
              local phase = obj.status.phase
              if phase == "Completed" then
                hs.status = "Healthy"
                hs.message = "Restore completed"
              elseif phase == "PartiallyFailed" then
                hs.status = "Degraded"
                hs.message = "Restore partially failed: " .. tostring(obj.status.errors or 0) .. " errors"
              elseif phase == "Failed" or phase == "FailedValidation" then
                hs.status = "Degraded"
                hs.message = "Restore failed: " .. phase
              else
                hs.status = "Progressing"
                hs.message = "Restore phase: " .. phase
              end
              return hs
            resource.customizations.health.argoproj.io_Application: |
              hs = {}
              hs.status = "Progressing"
              hs.message = "Waiting for Application"
              if obj.status ~= nil then
                if obj.status.health ~= nil and obj.status.sync ~= nil then
                  if obj.status.health.status == "Healthy" and obj.status.sync.status == "Synced" then
                    hs.status = "Healthy"
                    hs.message = obj.status.health.message or "Healthy and synced"
                  elseif obj.status.health.status == "Degraded" then
                    hs.status = "Degraded"
                    hs.message = obj.status.health.message or "Degraded"
                  end
                end
              end
              return hs
            resource.customizations.health.ceph.rook.io_CephCluster: |
              hs = {}
              if obj.status ~= nil then
                if obj.status.ceph ~= nil then
                  if obj.status.ceph.health == "HEALTH_OK" or obj.status.ceph.health == "HEALTH_WARN" then
                    hs.status = "Healthy"
                    hs.message = obj.status.ceph.health
                    return hs
                  elseif obj.status.ceph.health == "HEALTH_ERR" then
                    hs.status = "Degraded"
                    hs.message = obj.status.ceph.health
                    return hs
                  end
                end
              end
              hs.status = "Progressing"
              hs.message = "Waiting for Ceph Cluster"
              return hs
        server:
          metrics:
            enabled: true
          autoscaling:
            enabled: true
            minReplicas: 2
          ingress:
            enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10000
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    istio.io/dataplane-mode: ambient
