apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
        argocd.argoproj.io/reconcile-timeout: "15" 
spec:
  project: default
  source:
    repoURL: "https://argoproj.github.io/argo-helm"
    chart: argo-cd
    targetRevision: 9.4.17
    helm:
      releaseName: argocd
      valuesObject:
        redis-ha:
          metrics:
            enabled: true
          enabled: true
        dex:
          metrics:
            enabled: true
        controller:
          metrics:
            enabled: true
          replicas: 3
        repoServer:
          metrics:
            enabled: true
          autoscaling:
            enabled: true
            minReplicas: 2
        applicationSet:
          metrics:
            enabled: true
          replicas: 3
        global:
          domain: argocd.lightjack.lan
        configs:
          params:
            server.insecure: true
        server:
          metrics:
            enabled: true
          autoscaling:
            enabled: true
            minReplicas: 2
          ingress:
            enabled: false
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10000
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    istio.io/dataplane-mode: ambient
