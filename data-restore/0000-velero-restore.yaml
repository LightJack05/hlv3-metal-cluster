apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-restore
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  project: default
  sources:
  - repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: data-restore/0000-velero-restore/
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      limit: 10000
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
