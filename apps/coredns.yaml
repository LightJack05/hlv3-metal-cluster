apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: coredns
  project: default
  source:
    repoURL: https://github.com/LightJack05/hlv3-metal-cluster.git
    targetRevision: main
    path: apps/coredns.d/
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - SkipDryRunOnMissingResource=true
    - CreateNamespace=true
    - ServerSideApply=true
