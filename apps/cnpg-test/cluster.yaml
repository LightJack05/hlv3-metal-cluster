# Example of PostgreSQL cluster
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: test-cluster 
  namespace: cnpg-test
spec:
  inheritedMetadata:
    labels:
      velero.io/exclude-from-backup: "true"
  instances: 3
  storage:
    size: 5Gi
    storageClass: ceph-block
  monitoring:
    enablePodMonitor: true
