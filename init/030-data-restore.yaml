apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-restore
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-200"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: default
  source:
    repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: data-restore/
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
    syncOptions:
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10000
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
