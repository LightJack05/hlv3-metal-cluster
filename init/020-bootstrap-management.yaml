apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  annotations:
    # NOTE: This app does not install anything, it merely updates manifests of bootstrap components after the cluster is up and running.
    # Therefore, it needs to run AFTER the other components are pulled in. Otherwise, it will result in a race condition due to service monitor CRDs etc.
    argocd.argoproj.io/sync-wave: "-300"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: default
  source:
    repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: bootstrap-management/
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
    syncOptions:
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10000
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
