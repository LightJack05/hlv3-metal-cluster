apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1000"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: default
  source:
    repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: bootstrap-management/
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
    syncOptions:
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10000
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
