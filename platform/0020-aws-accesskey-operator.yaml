apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-accesskey-operator
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: ghcr.io/lightjack05/charts
    chart: aws-accesskey-operator
    targetRevision: 0.0.2
  - repoURL: https://github.com/LightJack05/hlv3-metal-cluster.git
    targetRevision: main
    path: platform/0020-aws-accesskey-operator/
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: aws-accesskey-operator-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - CreateNamespace=true
      - ServerSideApply=true

