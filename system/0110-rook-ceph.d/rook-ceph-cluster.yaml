apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph-cluster
    targetRevision: v1.19.1
    helm:
      releaseName: rook-ceph-cluster
      valuesObject:
        cephFileSystemVolumeSnapshotClass:
          enabled: true
        cephBlockPoolsVolumeSnapshotClass:
          enabled: true
        csi:
          csiAddons:
            enabled: true
          serviceMonitor:
            enabled: true
        monitoring:
          enabled: true
        cephClusterSpec:
          network:
            encryption:
              enabled: true
          storage:
            deviceFilter: '^sda$'
          dashboard:
            enabled: true
            ssl: false
        route:
          dashboard:
            parentRefs:
              - group: gateway.networking.k8s.io	
                kind: Gateway
                name: internal
                namespace: istio-system
            host:
              name: ceph.lightjack.lan
              path: '/'
              pathType: PathPrefix
        cephObjectStores: []
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 50
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
