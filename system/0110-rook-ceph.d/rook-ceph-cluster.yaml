apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-890"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.rook.io/release
    chart: rook-ceph-cluster
    targetRevision: v1.19.1
    helm:
      releaseName: rook-ceph-cluster
      valuesObject:
        cephClusterSpec:
          network:
            encryption:
              enabled: true
        route:
          dashboard:
            parentRefs:
              - kind: Gateway
                name: internal
                namespace: kgateway-system
            hostnames:
              - "ceph.lightjack.lan"
        cephObjectStores: []

  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
