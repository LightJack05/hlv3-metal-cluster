apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-800"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: system/0150-olm/
  destination:
    server: https://kubernetes.default.svc
    namespace: olm
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10000
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
