apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medik8s-snr

resources:
- git::https://github.com/medik8s/self-node-remediation.git//config/default?ref=v1.12.1
- certificate.yaml

images:
- name: quay.io/medik8s/self-node-remediation-operator
  newName: quay.io/medik8s/self-node-remediation-operator
  newTag: v1.12.1@sha256:0d3b9e5c3123b474c7c57b8c807248e743246627b5e24926638ebc8e9b9ecb3d

patches:
- target:
    kind: ValidatingWebhookConfiguration
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        cert-manager.io/inject-ca-from: "medik8s-snr/webhook-serving-cert"

- target:
    kind: MutatingWebhookConfiguration
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        cert-manager.io/inject-ca-from: "medik8s-snr/webhook-serving-cert"
