apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: webhook-serving-cert
spec:
  dnsNames:
  # The service name format is always <webhook-service-name>.<namespace>.svc
  - node-healthcheck-operator-webhook-service.node-healthcheck.svc
  - node-healthcheck-operator-webhook-service.node-healthcheck.svc.cluster.local
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-issuer
  secretName: webhook-server-cert # The operator deployment mounts this secret
