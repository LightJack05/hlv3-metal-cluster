apiVersion: self-node-remediation.medik8s.io/v1alpha1
kind: SelfNodeRemediationConfig
metadata:
  name: self-node-remediation-config
  namespace: medik8s
spec:
  # Bypasses the default OS-level reboot logic which will fail on Talos OS
  isSoftwareRebootEnabled: false
---
apiVersion: self-node-remediation.medik8s.io/v1alpha1
kind: SelfNodeRemediationTemplate
metadata:
  name: out-of-service-taint-template
  namespace: medik8s
spec:
  template:
    spec:
      # Instructs the operator to only apply the out-of-service taint
      remediationStrategy: OutOfServiceTaint
---
apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: cluster-wide-health-check
spec:
  # An empty selector applies this health check to ALL nodes (control-plane and workers)
  selector: {}
  remediationTemplate:
    apiVersion: self-node-remediation.medik8s.io/v1alpha1
    kind: SelfNodeRemediationTemplate
    name: out-of-service-taint-template
    namespace: medik8s
  # Requires at least 2 out of 4 nodes to be healthy before triggering remediation
  # This prevents the operator from tainting everything during a cluster-wide network outage
  minHealthy: "50%"
  unhealthyConditions:
    # 1. UNREACHABLE STATE: The node is dead/partitioned and the Kubelet cannot reach the API
    - type: Ready
      status: "Unknown"
      duration: 300s
    # 2. UNHEALTHY STATE: The Kubelet is talking to the API, but reporting internal failures
    - type: Ready
      status: "False"
      duration: 300s
