apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
      targetRevision: main
      path: system/0120-monitoring.d/config.d/alloy/
      directory:
        recurse: true
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.3.0
      helm:
        releaseName: alloy
        valuesObject:
          serviceMonitor:
            enabled: true
          alloy:
            envFrom: 
            - secretRef:
                name: loki-credentials
            extraPorts: 
            - name: "syslog"
              port: 1514
              targetPort: 1514
              protocol: "TCP"
            configMap:
              content: |-

                // General config
                logging {
                  level = "info"
                  format = "logfmt"
                }
                loki.write "loki_write" {
                  endpoint {
                    url = "http://loki-gateway.loki-system.svc.cluster.local:80/loki/api/v1/push"
                    basic_auth {
                      username = sys.env("LOKI_USER")
                      password = sys.env("LOKI_PASSWORD")
                    }
                  }
                }

                //Syslog config
                loki.source.syslog "syslog" {
                  listener {
                    address = "0.0.0.0:1514"
                  }
                  forward_to = [loki.process.syslog_to_loki.receiver]
                }

                loki.process "syslog_to_loki" {
                  forward_to = [loki.write.loki_write.receiver]
                  stage.json {
                    expressions = { message = "message" }
                  }
                }

                // Kubernetes pod logs
                discovery.kubernetes "pod" {
                  role = "pod"
                  // Restrict to pods on the node to reduce cpu & memory usage
                  selectors {
                    role = "pod"
                    field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
                  }
                }
                discovery.relabel "pod_logs" {
                  targets = discovery.kubernetes.pod.targets
                
                  // Label creation - "namespace" field from "__meta_kubernetes_namespace"
                  rule {
                    source_labels = ["__meta_kubernetes_namespace"]
                    action = "replace"
                    target_label = "namespace"
                  }
                
                  // Label creation - "pod" field from "__meta_kubernetes_pod_name"
                  rule {
                    source_labels = ["__meta_kubernetes_pod_name"]
                    action = "replace"
                    target_label = "pod"
                  }
                
                  // Label creation - "container" field from "__meta_kubernetes_pod_container_name"
                  rule {
                    source_labels = ["__meta_kubernetes_pod_container_name"]
                    action = "replace"
                    target_label = "container"
                  }
                
                  // Label creation -  "app" field from "__meta_kubernetes_pod_label_app_kubernetes_io_name"
                  rule {
                    source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                    action = "replace"
                    target_label = "app"
                  }
                
                  // Label creation -  "job" field from "__meta_kubernetes_namespace" and "__meta_kubernetes_pod_container_name"
                  // Concatenate values __meta_kubernetes_namespace/__meta_kubernetes_pod_container_name
                  rule {
                    source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                    action = "replace"
                    target_label = "job"
                    separator = "/"
                    replacement = "$1"
                  }
                
                  // Label creation - "__path__" field from "__meta_kubernetes_pod_uid" and "__meta_kubernetes_pod_container_name"
                  // Concatenate values __meta_kubernetes_pod_uid/__meta_kubernetes_pod_container_name.log
                  rule {
                    source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                    action = "replace"
                    target_label = "__path__"
                    separator = "/"
                    replacement = "/var/log/pods/*$1/*.log"
                  }
                
                  // Label creation -  "container_runtime" field from "__meta_kubernetes_pod_container_id"
                  rule {
                    source_labels = ["__meta_kubernetes_pod_container_id"]
                    action = "replace"
                    target_label = "container_runtime"
                    regex = "^(\\S+):\\/\\/.+$"
                    replacement = "$1"
                  }
                }

                loki.source.kubernetes "pod_logs" {
                  targets    = discovery.relabel.pod_logs.output
                  forward_to = [loki.process.pod_logs.receiver]
                }
                loki.process "pod_logs" {
                  stage.static_labels {
                      values = {
                        cluster = "default",
                      }
                  }
                
                  forward_to = [loki.write.loki_write.receiver]
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: alloy-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
