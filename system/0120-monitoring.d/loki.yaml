apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: system/0120-monitoring.d/config.d/loki/
    directory:
      recurse: true
  - repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.42.0
    helm:
      releaseName: loki
      valuesObject:
        server:
          # Increase the max header size (default is usually 8KB)
          http_server_read_header_timeout: 60s
          # Depending on version, you may need to increase the general buffer
          max_header_bytes: 16384
        gateway:
          nginxConfig:
            httpSnippet: |
              large_client_header_buffers 4 32k;
              client_header_buffer_size 16k;
          basicAuth:
            enabled: true
            existingSecret: loki-htpasswd-secret
        global:
          dnsService: kube-dns
        lokiCanary:
          extraArgs:
            - -pass=$(LOKI_PASSWORD)
            - -user=loki
          extraEnvFrom:
          - secretRef:
              name: loki-credentials
        loki:
          auth_enabled: false
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          ingester:
            chunk_encoding: snappy
          querier:
            # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
            max_concurrent: 4
          pattern_ingester:
            enabled: true
          limits_config:
            max_entries_limit_per_query: 10000 
  
            # The maximum number of series a query can touch (Increase this!)
            max_query_series: 100000
            
            # How much memory a single query is allowed to use
            max_query_lookback: 720h
            
            # If you are using a distributed Loki setup:
            split_queries_by_interval: 15m

            allow_structured_metadata: true
            volume_enabled: true
        
        
        deploymentMode: Distributed
        
        ingester:
          replicas: 3 # To ensure data durability with replication
          zoneAwareReplication:
             enabled: false
        querier:
          replicas: 3 # Improve query performance via parallelism
          maxUnavailable: 2
        queryFrontend:
          replicas: 2
          maxUnavailable: 1
        queryScheduler:
          replicas: 2
        distributor:
          replicas: 3 
          maxUnavailable: 2
        compactor:
          replicas: 1
        indexGateway:
          replicas: 2
          maxUnavailable: 1
        
        bloomPlanner:
          replicas: 0
        bloomBuilder:
          replicas: 0
        bloomGateway:
          replicas: 0
        
        backend:
           replicas: 0
        read:
           replicas: 0
        write:
           replicas: 0
        
        singleBinary:
           replicas: 0
        
        # Enable minio for storage
        minio:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: loki-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
