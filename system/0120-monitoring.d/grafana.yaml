apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: system/0120-monitoring.d/config.d/grafana/
    directory:
      recurse: true
  - repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 10.0.0
    helm:
      releaseName: grafana
      valuesObject:
        extraSecretMounts:
          - name: grafana-client-secret
            secretName: grafana-client-secret
            mountPath: /etc/secrets/oidc
            readOnly: true
            defaultMode: 0440
        grafana.ini:
          server:
            root_url: https://grafana.lightjack.lan
          auth:
            disable_login_form: true
            signout_redirect_url: https://auth.lightjack.lan/logout
          auth.generic_oauth:
            enabled: true
            auto_login: true
            name: Authelia
            client_id: grafana
            client_secret: $__file{/etc/secrets/oidc/client_secret}
            scopes: openid profile email groups
            auth_url: https://auth.lightjack.lan/api/oidc/authorization
            token_url: https://auth.lightjack.lan/api/oidc/token
            api_url: https://auth.lightjack.lan/api/oidc/userinfo
            login_attribute_path: preferred_username
            groups_attribute_path: groups
            use_pkce: true
            role_attribute_path: >-
              contains(groups[*], 'grafana-admins') && 'Admin' ||
              contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: ALL # Optional: scans all namespaces for dashboards
        plugins:
          - grafana-metricsdrilldown-app
        replicas: 1
        envFromSecret: loki-credentials
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus-operated.prometheus-system.svc.cluster.local:9090
              access: proxy
              isDefault: true
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-gateway.loki-system.svc.cluster.local:80
              basicAuth: true
              basicAuthUser: ${LOKI_USER}
              secureJsonData:
                basicAuthPassword: ${LOKI_PASSWORD}
              jsonData:
                timeout: 60
                maxLines: 1000
        route:
          main:
            enabled: true
            apiVersion: gateway.networking.k8s.io/v1
            kind: HTTPRoute
            hostnames: 
            - grafana.lightjack.lan
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: internal
                namespace: istio-system
            matches:
              - path:
                  type: PathPrefix
                  value: /
        persistence:
          type: pvc
          enabled: true
          storageClassName: ceph-filesystem
          accessModes:
            - ReadWriteMany
          size: 10Gi
          disableWarning: false
          extraPvcLabels:
            velero.io/exclude-from-backup: "true"
          inMemory:
            enabled: false
          lookupVolumeName: true
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10000
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
