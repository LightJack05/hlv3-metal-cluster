apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-gateway-aoa
  namespace: argocd
  annotations:
    argocd.argoproj.io/reconcile-timeout: "15" 
    argocd.argoproj.io/sync-wave: "-800"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: default
  source:
    repoURL: https://github.com/LightJack05/hlv3-metal-cluster.git
    targetRevision: main
    path: system/0100-argocd-gateway.d/
  syncPolicy:
    automated: 
      prune: true
      selfHeal: true
    syncOptions:
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10000
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
