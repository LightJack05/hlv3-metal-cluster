apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-600"
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno-system
  project: default
  sources:
  - repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: system/0190-kyverno/
    directory:
      recurse: true
  - repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.8.1
    helm:
      valuesObject:
        admissionController:
          replicas: 3
        backgroundController:
          replicas: 3
        cleanupController:
          replicas: 3
        reportsController:
          replicas: 3
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      limit: 10000
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
  ignoreDifferences:
    - group: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.labels
        - .metadata.annotations
