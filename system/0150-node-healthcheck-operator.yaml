apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-healthcheck-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-700"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/medik8s/node-healthcheck-operator.git'
    targetRevision: release-0.11 
    path: config/default
  destination:
    server: https://kubernetes.default.svc
    namespace: nhco-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

