apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http-route
  namespace: argocd
spec:
  parentRefs:
  - kind: Gateway
    name: internal
    namespace: istio-system
  hostnames:
  - "argocd.lightjack.lan"
  rules:
  - backendRefs:
    - name: argocd-server
      kind: Service
      port: 80
