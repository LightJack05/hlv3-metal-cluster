apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-aoa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-900"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  project: default
  source:
    repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: system/0120-monitoring.d/
    directory:
      recurse: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
