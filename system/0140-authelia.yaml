apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-800"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia-system
  project: default
  sources:
    - repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
      targetRevision: main
      path: system/0140-authelia.d/
    - repoURL: https://charts.authelia.com
      chart: authelia
      targetRevision: 0.10.50 # check latest
      helm:
        valuesObject:
          service:
            port: 9091
          ingress:
            enabled: false
          secret:
            existingSecret: authelia-secrets
          configMap:
            identity_providers:
              oidc:
                enabled: true
                hmac_secret: '{{`{{ secret "/secrets/OIDC_HMAC_KEY" }}`}}'
                jwks:
                  - key_id: main
                    algorithm: RS256
                    use: sig
                    key: |
                      {{`{{ secret "/secrets/OIDC_JWKS_KEY" | mindent 12 "|" | msquote }}`}}
                claims_policies:
                  default:
                    id_token: ['groups', 'email', 'preferred_username']
                clients:
                  - client_id: grafana
                    client_name: Grafana
                    client_secret: '{{`{{ secret "/secrets/clients/grafana.digest" }}`}}'
                    public: false
                    authorization_policy: two_factor
                    claims_policy: default
                    redirect_uris:
                      - 'https://grafana.lightjack.lan/login/generic_oauth'
            server:
              endpoints:
                authz:
                  forward-auth:
                    implementation: ForwardAuth
                  ext-authz:
                    implementation: ExtAuthz
            theme: dark
            authentication_backend:
              file:
                enabled: true
                path: /config/users_database.yml
                password:
                  algorithm: argon2id
            session:
              cookies:
              - domain: lightjack.lan
                subdomain: auth
              - domain: lightjack.de
                subdomain: auth
            access_control:
              default_policy: one_factor
            storage:
              local:
                enabled: true
            notifier:
              filesystem:
                enabled: true
            totp:
              disable: true
          pod:
            kind: Deployment
            replicas: 1
            extraVolumes:
              - name: users-db
                secret:
                  secretName: authelia-users
            extraVolumeMounts:
              - name: users-db
                mountPath: /config/users_database.yml
                subPath: users_database.yml
                readOnly: true
            env:
              - name: X_AUTHELIA_CONFIG_FILTERS
                value: template
            extraVolumes:
              - name: oidc-clients
                projected:
                  defaultMode: 0400
                  sources:
                    - secret:
                        name: grafana-client-digest
                        items: [{ key: digest, path: grafana.digest }]
            extraVolumeMounts:
              - name: oidc-clients
                mountPath: /secrets/clients
                readOnly: true
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      limit: 10000
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
        - /spec/rules/0/matches
        - /spec/rules/0/matches/0
        - /spec/rules/0/matches/0/path
        - /spec/rules/0/matches/0/path/type
        - /spec/rules/0/matches/0/path/value
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/parentRefs/0/weight
