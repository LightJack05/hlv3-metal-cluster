apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia-internal
  namespace: authelia-system
spec:
  parentRefs:
    - name: internal
      namespace: istio-system
  hostnames:
    - auth.lightjack.lan
  rules:
    - backendRefs:
        - name: authelia
          port: 9091
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia-external
  namespace: authelia-system
spec:
  parentRefs:
    - name: external
      namespace: istio-system
  hostnames:
    - auth.lightjack.de
  rules:
    - backendRefs:
        - name: authelia
          port: 9091
