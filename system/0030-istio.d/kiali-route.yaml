apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali-route
  namespace: istio-system
spec:
  parentRefs:
  - kind: Gateway
    name: internal
    namespace: istio-system
  hostnames:
  - "kiali.lightjack.lan"
  rules:
  - backendRefs:
    - name: kiali
      kind: Service
      port: 20001
