apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: istio-ingress
  annotations:
    # Istio passes this to the generated LoadBalancer Service for kube-vip
    kube-vip.io/loadbalancerIPs: "10.3.0.3"
spec:
  # Using the default Istio GatewayClass
  gatewayClassName: istio
  addresses:
    - type: IPAddress
      value: 10.3.0.3
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lightjack.de"
      allowedRoutes:
        namespaces:
          from: All
          
  # Note: Because this gateway is handling external traffic, 
  # uncommenting the HTTPS block below and securing it with TLS 
  # is highly recommended once your certificates are provisioned.
  
