apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-kiali
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-850"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kiali.org/helm-charts
    chart: kiali-server
    targetRevision: 2.24.0 # Use the version compatible with Istio 1.24
    helm:
      valuesObject:
        auth:
          strategy: anonymous # Keeps it simple for local port-forwarding access
        deployment:
          view_ambient: true
        external_services:
          istio:
            ambient_enabled: true
          prometheus:
            # Replace with your actual Prometheus service DNS and port
            url: "http://prometheus-operated.prometheus-system.svc.cluster.local:9090"
          grafana:
            # Replace with your actual Grafana service DNS and port
            enabled: true
            in_cluster_url: "http://grafana.grafana-system.svc.cluster.local:80"
            url: "http://grafana.grafana-system.svc.cluster.local:80" # Used for external links in UI
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 50
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
