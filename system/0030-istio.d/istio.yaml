apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-870"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.29.1
    helm:
      valuesObject:
        meshConfig:
          defaultConfig:
            metricsExporter: PROMETHEUS
          enablePrometheusMerge: true
          extensionProviders:
            - name: 'authelia'
              envoyExtAuthzHttp:
                service: 'authelia.authelia-system.svc.cluster.local'
                port: 9091
                pathPrefix: '/api/authz/ext-authz/'
                includeRequestHeadersInCheck:
                  - 'accept'
                  - 'cookie'
                  - 'location'
                  - 'authorization'
                  - 'proxy-authorization'
                headersToUpstreamOnAllow:
                  - 'remote-*'
                  - 'authelia-*'
                includeAdditionalHeadersInCheck:
                  X-Forwarded-Proto: '%REQ(:SCHEME)%'
                headersToDownstreamOnDeny:
                  - 'set-cookie'
                headersToDownstreamOnAllow:
                  - 'set-cookie'
        profile: ambient
        pilot:
          env:
            PILOT_ENABLE_AMBIENT: "true"
            PILOT_ENABLE_AMBIENT_CONTROLLERS: "true"
        telemetry:
          enabled: true
          v2:
            enabled: true
            prometheus:
              enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 50
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      # You can also target ValidatingWebhookConfiguration if the diff is there
      jqPathExpressions:
        - .webhooks[].failurePolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].failurePolicy
---
