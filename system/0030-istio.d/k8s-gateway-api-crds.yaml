apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/reconcile-timeout: "15" 
    argocd.argoproj.io/sync-wave: "-900"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Points to the official v1.2.1 Standard channel
    repoURL: 'https://github.com/kubernetes-sigs/gateway-api.git'
    path: config/crd/standard
    targetRevision: release-1.5
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # Required because these CRDs are large
    retry:
      limit: 50
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
