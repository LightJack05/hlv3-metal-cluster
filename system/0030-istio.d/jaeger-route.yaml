apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger-route
  namespace: istio-system
spec:
  parentRefs:
  - name: internal
    namespace: istio-system
  hostnames:
  - "jaeger.lightjack.lan"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: tracing # Ensure this matches your Jaeger service name
      port: 16685
