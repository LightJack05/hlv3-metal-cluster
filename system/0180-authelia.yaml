apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-600"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia-system
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 18.5.0
      chart: postgresql
    - repoURL: https://charts.bitnami.com/bitnami
      targetRevision: 25.3.0
      chart: redis
    - repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
      targetRevision: main
      path: system/0180-authelia.d/
    - repoURL: https://charts.authelia.com
      chart: authelia
      targetRevision: 0.10.50 # check latest
      helm:
        valuesObject:
          service:
            port: 9091
          ingress:
            enabled: false
          configMap:
            server:
              endpoints:
                authz:
                  forward-auth:
                    implementation: ForwardAuth
                  ext-authz:
                    implementation: ExtAuthz
            theme: dark
            authentication_backend:
              file:
                enabled: true
                path: /config/users_database.yml
                password:
                  algorithm: argon2id
            session:
              cookies:
              - domain: lightjack.lan
                subdomain: auth
              - domain: lightjack.de
                subdomain: auth
              redis:
                enabled: true
                host: 'redis'
            access_control:
              default_policy: one_factor
            storage:
              local:
                enabled: false
              postgres:
                enabled: true
                host: 'postgres'
            notifier:
              filesystem:
                enabled: true
            totp:
              disable: true
          pod:
            extraVolumes:
              - name: users-db
                secret:
                  secretName: authelia-users
            extraVolumeMounts:
              - name: users-db
                mountPath: /config/users_database.yml
                subPath: users_database.yml
                readOnly: true
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
      - CreateNamespace=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
        - /spec/rules/0/matches
        - /spec/rules/0/matches/0
        - /spec/rules/0/matches/0/path
        - /spec/rules/0/matches/0/path/type
        - /spec/rules/0/matches/0/path/value
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/parentRefs/0/weight
