apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: root-ca
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: 'root-ca'    # the Secret your ClusterIssuer's ca.secretName points at
        key: 'tls.crt'
  target:
    configMap:
      key: 'ca-bundle.crt'
    namespaceSelector:
      matchLabels:
        trust: enabled
