apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1000"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://gitea.lightjack.de/Kubernetes/metal-cluster.git
    targetRevision: main
    path: system/0050-cert-manager.d/
    directory:
      recurse: true
  - repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.15.0 
    helm:
      releaseName: cert-manager
      values: |
        installCRDs: true
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          enableGatewayAPI: true
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true           # Deletes resources that are no longer in the chart
      selfHeal: true        # Fixes drift automatically
    syncOptions:
      - CreateNamespace=true # Creates the namespace if it doesn't exist
      - ServerSideApply=true

